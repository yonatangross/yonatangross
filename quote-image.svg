<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle code pattern -->
  <defs>
    <pattern id="codePattern" patternUnits="userSpaceOnUse" width="100" height="100" patternTransform="scale(0.5)">
      <text x="0" y="15" fill="#2d333b" opacity="0.07" font-family="monospace" font-size="12">{code}</text>
      <text x="10" y="35" fill="#2d333b" opacity="0.07" font-family="monospace" font-size="12">function(){}</text>
      <text x="5" y="55" fill="#2d333b" opacity="0.07" font-family="monospace" font-size="12">if(humor){}</text>
      <text x="15" y="75" fill="#2d333b" opacity="0.07" font-family="monospace" font-size="12">return;</text>
    </pattern>
    <linearGradient id="quoteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a6186"/>
      <stop offset="100%" stop-color="#89253e"/>
    </linearGradient>
  </defs>
  
  <!-- Background rectangle with pattern -->
  <rect width="800" height="250" fill="#f5f5f5"/>
  <rect width="800" height="250" fill="url(#codePattern)"/>
  
  <!-- Decorative elements -->
  <rect x="20" y="20" width="760" height="210" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="2"/>
  
  <!-- Code brackets -->
  <text x="50" y="80" font-family="monospace" font-size="60" fill="#3a6186">{</text>
  <text x="730" y="180" font-family="monospace" font-size="60" fill="#89253e">}</text>
  
  <!-- The quote -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="url(#quoteGradient)">
    "Code is like humor.
  </text>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="url(#quoteGradient)">
    When you have to explain it, it's bad."
  </text>
  
  <!-- Attribution -->
  <text x="400" y="190" font-family="Arial, sans-serif" font-style="italic" font-size="18" text-anchor="middle" fill="#555">
    – Cory House
  </text>
  
  <!-- Small laugh emoji -->
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="24" fill="#89253e">😄</text>
  
  <!-- Small code symbols -->
  <text x="70" y="210" font-family="monospace" font-size="18" fill="#3a6186">&lt;/&gt;</text>
</svg>