name: validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate plugin.json against the Agent Plugins schema and check AGENTS.md
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/plugin.schema.json" \
            https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          python - <<'PY'
          import json, os, sys
          import jsonschema

          schema = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "plugin.schema.json")))
          manifest = json.load(open("plugin.json"))
          jsonschema.Draft202012Validator(schema).validate(manifest)
          print("plugin.json: valid against", schema.get("$id"))

          if not os.path.isfile("AGENTS.md") or os.path.getsize("AGENTS.md") == 0:
              sys.exit("AGENTS.md is missing or empty")
          print("AGENTS.md: present,", os.path.getsize("AGENTS.md"), "bytes")
          PY
